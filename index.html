<title>Hoop Stars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a 16:9 court canvas with an HTML overlay for menus; touch pad appears under it on phones. */
:root{
  --bg:#0f1e2e; --panel:#172b40; --panel2:#1f3a54; --line:#2c4a66;
  --ink:#eef3f7; --muted:#9db2c4; --hi:#3fd3c6; --warm:#ffb347; --danger:#ef4f48;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:12px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 clamp(26px,5vw,36px)/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
h1 span{color:var(--warm)}
.tools{display:flex;gap:8px}
button{font:600 14px var(--body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--hi)}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;
  background:#12263a;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;padding:10px;overflow:auto;background:rgba(9,18,29,.8)}
.screen[hidden]{display:none}
.card{margin:auto;max-width:580px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card.wide{max-width:640px}
.card h2{margin:0;font:700 clamp(28px,5vw,44px)/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.card h3{margin:4px 0 0;font:600 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.lead{color:var(--ink)}
.small{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 18px}
.btn.primary{background:var(--warm);color:#2b1a05;border-color:transparent}
.btn.primary:hover{background:#ffc069}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px}
.pick b{font:700 20px var(--display);letter-spacing:.04em;text-transform:uppercase}
.pick small{color:var(--muted);font-weight:500;font-size:12px}
.pick .sw{font:500 12px/1.35 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.pick .sw.up{color:#7fe0a0}
.pick .sw.tk{color:var(--warm)}
.pick .sw.dn{color:#ffb37a}
.pick:disabled{opacity:.4;cursor:not-allowed}
.pick .ph{width:64px;height:64px;border-radius:8px;margin-bottom:4px}
.pick .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.pick.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.rounds{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.rounds li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.rounds li.now{border-color:var(--warm)}
.rounds li.done{opacity:.6}
.rounds li.lock{opacity:.45}
.score{font:700 54px/1 var(--display);letter-spacing:.04em}
.stats{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.stats>*:nth-child(3n+1){text-align:left}.stats>*:nth-child(3n+2){text-align:center}.stats>*:nth-child(3n){text-align:right}
.stats .sn{font:700 18px var(--display);letter-spacing:.05em;text-transform:uppercase}
.stats .sl{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.stats .sv{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.pad{display:none;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pad .grp{display:flex;gap:8px}
.pad button{min-width:74px;height:64px;font-size:15px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad button.on{background:var(--hi);color:#06322e}
@media (pointer:coarse),(max-width:640px){.pad{display:flex}}
.keys{margin:0;color:var(--muted);font-size:13px}
kbd{font:600 12px var(--body);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--ink)}
.card.xl{max-width:860px}
.card.menu{max-width:440px;text-align:center;align-items:stretch;gap:10px;padding:26px 24px}
.card.menu h2{font-size:clamp(40px,8vw,68px)}
.card.menu .btn{padding:14px 18px;font-size:17px;letter-spacing:.04em}
.card.menu .btn.primary{font-size:19px}
.card.menu .btn small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px}
.card.menu details{text-align:left;color:var(--muted);font-size:13px}
.card.menu summary{cursor:pointer;color:var(--ink);font-weight:600;margin-bottom:6px}
.card h3.team{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink)}
.card h3.team::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.card h3.team::after{content:"";flex:1;height:1px;background:var(--line)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{flex:1;min-width:150px;text-align:left}
.slot.on{border-color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm)}
.badge{font:700 11px var(--body);letter-spacing:.08em;color:#06322e;background:var(--c);border-radius:5px;padding:1px 6px;margin-top:2px}
.wrap.fs{max-width:none;margin:0;padding:8px;box-sizing:border-box;width:100%;height:100%;background:var(--bg);align-items:center;justify-content:center;gap:6px;overflow:auto}
.wrap.pfs{position:fixed;inset:0;z-index:50}
.wrap.fs h1,.wrap.fs .keys{display:none}
.wrap.fs .top{justify-content:center}
.wrap.fs .stage{flex:none;width:min(100%,calc((100vh - var(--chrome,70px))*16/9))}
.wrap.fs .pad{width:100%}
@media (pointer:coarse){.wrap.fs{--chrome:150px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.card.menu{max-width:340px;padding:24px 22px}
.card.menu h2{font-size:clamp(34px,7vw,54px)}
.card.menu .btn{padding:9px 14px;font-size:12px;border-radius:999px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card.menu .btn.primary{background:linear-gradient(135deg,#ffb347,#ff7a3d);color:#1d1000;border-color:transparent;box-shadow:0 8px 18px -10px #ff7a3d}
.card.menu .btn.primary:hover{filter:brightness(1.08)}
.sect{margin:16px 0 6px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:640px){.tcols{grid-template-columns:1fr}}
.thead{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.thead h3{flex:1;margin:0;text-align:center;color:var(--ink)}
.thead h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:8px}
.arr{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;line-height:1;padding:0;cursor:pointer}
.arr:hover{border-color:var(--warm);color:var(--warm)}
.tlist{display:grid;gap:8px}
.tlist .pick{width:100%;text-align:left}
.tlist.tpair{grid-template-columns:1fr 1fr}
.tcols.one{grid-template-columns:1fr}
@media (max-width:640px){.tlist.tpair{grid-template-columns:1fr}}
.pick:disabled{opacity:.35;filter:grayscale(1);cursor:not-allowed;transform:none}
.side{min-width:0}
.sidelbl{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.stage #pause{position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:4;padding:6px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(8,16,26,.72);color:#fff;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}

.binds{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(94%,660px);padding:9px 14px;border-radius:12px;background:rgba(8,16,26,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink);font-size:12px;opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:3}
.binds.on{opacity:1}
.binds .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.binds kbd{margin:0 2px}
.bracket{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px}
.rcol{flex:0 0 178px;display:flex;flex-direction:column}
.rbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.rcol h4{margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.match{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 18px -14px #000}
.match.mine{border-color:#ffb347;box-shadow:0 0 0 1px rgba(255,179,71,.35),0 10px 22px -12px #ffb347}
.match.tbd{opacity:.45}
.mrow{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:8px;color:var(--muted)}
.mrow+.mrow{margin-top:2px}
.mrow .av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--c);box-shadow:0 0 0 2px var(--c)}
.mrow .nm{flex:1;min-width:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{font-size:15px;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.mrow.won{color:var(--ink);background:rgba(255,255,255,.08)}
.mrow.won .sc{color:#ffd166}
.mrow.out{opacity:.5}
.mrow.me .nm{color:#ffb347}
.pips{display:flex;gap:5px;justify-content:center;padding:6px 0 2px}
.pips i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.pips i.top{background:#ffd166}
.pips i.bot{background:#7fe0d8}
</style>

  <header class="top">

  </header>
  <div class="stage">

    <button id="pause" type="button" hidden>Pause</button>
    <div class="screen" id="screen"></div>
    <div class="binds" id="binds" aria-hidden="true"></div>

  <div class="pad" id="pad">

</main>

  /* the chase-down: the ball is at the backboard and not coming down. Either it has bounced off the board and is going back up,

      b.vx=(b.x>=cx?1:-1)*150;b.vy=-Math.abs(b.vy)*.3-60;b.noPick={p:o,t:.25};

    s.foulCk=true;

function updateBall(dt,live){
  const b=st.ball;b.t+=dt;
  if(b.noPick){b.noPick.t-=dt;if(b.noPick.t<=0)b.noPick=null}
  if(b.pickCd>0)b.pickCd-=dt;
  if(b.state==='idle')return;
  if(b.state==='held'){
    const p=b.owner;
    const pz=getPose(p);
    let tx,ty;
    if(p.meter||(pz&&pz.a1!==undefined)){const hp=handPos(p);tx=hp.x;ty=hp.y-4}
    else{
      /* a dribble at a natural pace (about two bounces a second), with the ball rising a little less high */
      const bounce=p.y>=FLOOR?Math.abs(Math.sin(b.t*6+p.idx))*22:0,sc=p.ch.sc||1;
      tx=p.x+p.face*18*sc;ty=p.y-(16+bounce)*sc;

    /* a dash: one big dribble that bounces once in the direction of the dash */
    if(p.dash>0&&p.has&&!st.ft){const fwd=p.dashDir===p.face,pr=clamp(1-p.dash/.26,0,1);tx=p.x+p.face*(fwd?26:12);ty=FLOOR-R-50*Math.abs(Math.cos(Math.PI*pr))}
    /* ease toward the hand so the ball never snaps between poses */
    const k=1-Math.exp(-dt*45);

    b.vx=0;b.vy=0;return;
  }
  for(let k=0;k<SUB;k++){if(b.state==='held'||b.state==='idle')break;if(stepBall(dt/SUB,live))break}

  if(b.shot&&b.shot.pts===3&&b.state==='air'&&!b.shot.scored)emit({x:b.x,y:b.y,vx:0,vy:0,life:.32,size:R*.75,col:WHITEP,a0:.4,shrink:true,add:true});
  if(b.y>FLOOR-R){
    b.y=FLOOR-R;
    if(b.vy>140){b.vy=-b.vy*.6;sfx('bounce')}else b.vy=0;
    b.vx*=.92;
    if(b.state==='air')b.state='loose';
    if(b.shot&&!b.shot.scored){shotMiss(b.shot);b.shot=null}
  }
  if(b.state==='loose'&&live&&!(b.pickCd>0)){
    for(const p of st.p){
      if(b.noPick&&b.noPick.p===p)continue;
      if(p.dunking)continue;
      if(Math.abs(b.x-p.x)<30&&b.y>p.y-92&&b.y<p.y+4&&p.stun<=0){give(p);break}
    }
  }
}
function celebrateScore(s,p){

  let runEnded=false;
  if(st.run.idx===p.idx)st.run.pts+=s.pts;
  else{if(st.run.pts>=6)runEnded=true;st.run={idx:p.idx,pts:s.pts}}
  if(s.pts===3&&!s.dunk)p.threes++;
  if(s.poster)return;
  const late=st.ot?st.time<=15:st.time<=25;
  let nm=null;
  if(s.pts===3&&!s.dunk&&st.time<=20&&prev<=0&&lead>0)nm='dametime';
  else if((late&&lead>=6)||(late&&lead>=4&&st.time<=8))nm='nightnight';
  else if(!s.dunk&&s.pts===3&&p.threes>=3&&Math.random()<.7)nm='shrug';
  else if(!s.dunk&&s.pts===3&&s.step&&Math.random()<.7)nm='bow';
  else if(runEnded&&Math.random()<.8)nm='hush';
  else if(s.dunk&&Math.random()<.5)nm=Math.random()<.5?'chestpound':'flex';
  else if(s.pts===3&&Math.random()<.3)nm=Math.random()<.5?'shimmy':'flex';

function scoreShot(s){

function setupTip(){

    p.y=FLOOR;p.vx=0;p.vy=0;p.meter=null;p.stun=0;p.dash=0;p.protect=0;p.step=0;p.anim=null;p.dunking=null;
    p.fakeT=0;p.bit=false;p.hang=0;p.pend=null;p.fall=null;p.sp=null;p.has=false;p.face=p.ad;p.tj=null;
    if(p.ai)p.ai=freshAI();

function startTip(){

  st.tip={t:0,ta,tt:ta+.12,tapped:false,winner:null,after:0};
  for(const p of st.p){
    p.tj=null;p.tipJp=!!p.inp.jump;

/* the toss peaks at this time: jumping earlier than that gets the ball on its way up, so nobody may jump before it */
const TIP_PEAK=313/401;
function tipStep(dt){
  poll();
  const T=st.tip,b=st.ball;T.t+=dt;
  for(const p of st.p){
    let want=false;
    if(p.ai)want=p.tj==null&&T.t>=Math.max(p.tipAt,TIP_PEAK);
    else{want=p.tj==null&&!!p.inp.jump&&!p.tipJp&&T.t>=TIP_PEAK;p.tipJp=!!p.inp.jump}
    if(want&&!T.tapped&&p.y>=FLOOR){p.vy=-p.ch.jump;p.tj=T.t;p.anim={n:'tipjump',t:0,d:1}}
    p.vy+=PG*dt;p.y+=p.vy*dt;
    if(p.y>=FLOOR){p.y=FLOOR;p.vy=0}
    if(p.anim){p.anim.t+=dt*(p.anim.slow||1);if(p.anim.t>=p.anim.d)p.anim=null}
  }
  if(!T.tapped){
    /* the ball is tossed up and falls; whoever's hand reaches it first wins the tip */
    const y=290-313*T.t+200.5*T.t*T.t;
    b.state='idle';b.x=W/2;b.y=Math.min(FLOOR-8,y);
    const hit=st.p.find(p=>{const h=handPos(p);return Math.hypot(h.x-b.x,h.y-b.y)<34});
    if(hit){
      T.tapped=true;T.winner=hit;T.after=.9;
      b.state='loose';b.vx=(hit.x-b.x)/.45;b.vy=-40;b.noPick={p:st.p[1-hit.idx],t:.9};
      msg('TIPPED',b.x,b.y-30,'#ffb347');sfx('tick');cheer(.4,1.2);hideBinds();
    }else if(y>=FLOOR-8){
      /* nobody jumped: it drops and the first player to reach it gets it */
      T.tapped=true;T.winner=null;T.after=0;b.state='loose';b.vx=0;b.vy=0;b.y=FLOOR-8;hideBinds();
      st.phase='play';st.tip=null;   /* players can move again to go get it */
    }
  }else{
    T.after-=dt;updateBall(dt,true);
    if(T.winner&&!st.p.some(q=>q.has)&&T.after<=0)give(T.winner);
    if(st.p.some(q=>q.has)){st.phase='play';st.tip=null}
  }
}
function checkEnd(){
  const [a,c]=st.p;
  if(st.time<=0){
    if(a.score!==c.score){finish();return true}
    st.ot=true;st.time=OT;msg('OVERTIME',W/2,150,'#ffb347');
    st.tipNext=true;st.phase='count';st.pt=2.4;setupTip();
    return true;
  }
  return false;
}
function updatePlayers(dt,act){
  const [a,c]=st.p;
  poll();
  for(const p of st.p){
    const o=p===a?c:a;
    if(p.ai&&act)aiInput(p,o,dt);
    stepPlayer(p,o,p.inp,dt,act);
  }
  if(a.y>=FLOOR&&c.y>=FLOOR&&a.dash<=0&&c.dash<=0&&!a.dunking&&!c.dunking){
    const d=c.x-a.x,ov=26-Math.abs(d);
    if(ov>0){const s=d>=0?1:-1;a.x-=s*ov/2;c.x+=s*ov/2}

}
function update(dt){
  if(!st||st.paused||st.phase==='over')return;
  /* hit-stop: a block freezes the game for a few frames */
  if(st.hitstop>0){st.hitstop=Math.max(0,st.hitstop-dt);return}
  crowdUpdate(dt);
  for(const m of st.msgs)m.t+=dt;
  st.msgs=st.msgs.filter(m=>m.t<1.1);
  st.trail.forEach(t=>t.t+=dt);st.trail=st.trail.filter(t=>t.t<.35);
  st.shake=Math.max(0,st.shake-dt);
  st.flash=Math.max(0,st.flash-dt*2.2);
  if(st.edge){st.edge.t-=dt;if(st.edge.t<=0)st.edge=null}
  for(const p of st.p)if(p.tkOn){p._fa=(p._fa||0)+dt*40;while(p._fa>=1){p._fa-=1;emitFlame(p)}}
  if(st.banner){st.banner.t+=dt;if(st.banner.t>1.7)st.banner=null}
  if(st.phase==='count'){
    st.pt-=dt;updatePlayers(dt,false);updateBall(dt,false);
    if(st.pt<=0){if(st.tipNext)startTip();else st.phase='play'}
    return;
  }
  if(st.phase==='tip'){tipStep(dt);return}
  if(st.phase==='play'){
    if(st.ftWait>0)st.ftWait=Math.max(0,st.ftWait-dt);
    if(st.time>0&&!st.ft)st.time=Math.max(0,st.time-dt);
    for(const p of st.p)if(p.tkOn&&!st.ft){p.to-=dt/TK_DUR;if(p.to<=0){p.to=0;p.tkOn=false;msg('TAKEOVER OVER',p.x,p.y-130,'#9db2c4')}}
    updatePlayers(dt,true);updateBall(dt,true);
    const bl=st.ball,settled=bl.y>=FLOOR-R-.5&&Math.abs(bl.vy)<1&&Math.abs(bl.vx)<10;
    /* the phase check stops the game ending when a miss on the final clock just set up a foul shot (shotMiss moves the phase to 'goal') */
    if(st.phase==='play'&&st.time<=0&&!bl.shot&&bl.state!=='air'&&(bl.state==='held'||settled)&&!st.p[0].dunking&&!st.p[1].dunking)checkEnd();
    return;
  }
  if(st.phase==='goal'){
    st.pt-=dt;updatePlayers(dt,false);updateBall(dt,false);
    /* a poster: the stoppage waits while the defender falls and gets up, then a short beat before the next possession */
    if(st.pt<=0&&st.p.some(q=>q.fall)){st.pt=0;st.posterWait=.5}
    else if(st.pt<=0&&st.posterWait>0){st.posterWait-=dt;st.pt=0}
    else if(st.pt<=0){
      st.posterWait=0;
      if(st.ftPending)startFT();
      else if(st.ft&&st.ft.left>0)ftSetup();
      else{st.ft=null;if(!checkEnd()){resetPositions(st.concede);st.phase='count';st.pt=1.1}}
    }
  }
}
/* ---------- free throws ---------- */

/* ---------- CPU opponent ---------- */
/* CPU release point: spread across its shot windows, harder CPUs release closer to the apex */
function aiRelease(p,o,lvl){const t=tiers(p,o,layupNow(p));return Math.random()*t.o*(1.1-.3*lvl)}
function aiInput(p,o,dt){
  const a=p.ai,inp=p.inp,lvl=p.lvl,b=st.ball,h=hoops[p.atk],own=hoops[o.atk];
  inp.l=0;inp.r=0;inp.jump=0;

  if(p.dunking)return;

    const dist=Math.abs(p.x-h.x);
    if(p.meter){
      if(st.ft&&st.ft.p===p){
        if(a.ftT===undefined)a.ftT=(Math.random()<.5?.225:.675)+(Math.random()-.5)*.3*(1.1-lvl);
        inp.jump=p.meter.t<a.ftT?1:0;return;
      }
      const u=Math.abs(p.vy)/p.ch.jump;
      if(a.drive)go(h.x-p.ad*20,4);
      if(u<=a.tgtU||p.vy>=0)inp.jump=0;   /* release near the apex (the meter only exists once airborne) */else inp.jump=1;
      return;
    }
    if(p.y<FLOOR)return;
    /* a free throw: nobody can move, so the CPU just takes the shot */
    if(st.ft&&st.ft.p===p){a.tgtU=aiRelease(p,o,lvl);inp.jump=(st.ftWait>0||p.jp)?0:1;return}
    if(p.to>=1&&!p.tkOn)inp.sup=1;

       and only throws up a heave from wherever it is in the last moment before the buzzer. */
    const behind=o.score-p.score;
    const clutch=st.time<=8&&behind>=1&&behind<=3;
    if(clutch&&st.time<=1.5){a.tgtU=aiRelease(p,o,lvl);inp.jump=1;return}
    if(clutch&&tiers(p,o,layupNow(p)).cm>=.95&&Math.abs(o.x-p.x)>=85){a.tgtU=aiRelease(p,o,lvl);inp.jump=1;return}
    if(!a.spot){
      const far=p.ch.deep<.7?.5:1;

      a.drive=Math.random()<.3+lvl*.4+(p.ch.deep<.7?.4:0);
    }

    if(gap<100&&p.fakeCd<=0&&Math.random()<dt*lvl*.5)inp.fake=1;

    /* CPU shove: a defender right in front at arm's length gets pushed back, with the CPU's own takeover bar */

    if(a.drive){

      if(dist<=185&&p.vx*p.ad>95){inp.jump=1;a.tgtU=aiRelease(p,o,lvl)}

const NET_COLS=7,NET_ROWS=5,NET_DEPTH=40;
function initNet(h){

    const f=r/(NET_ROWS-1),hw=RIMH*(1-.4*f),row=[];

/* ---------- tournament: 16 characters, playoff bracket, best of 3 ---------- */
const isHuman=m=>m.a===flow.ch||m.b===flow.ch;
const newMatch=(a,b,need=1)=>({a,b,need,wa:0,wb:0,games:[],winner:null,done:false});
const powerOf=i=>{const c=CH[i];return Math.pow(c.zone+c.deep+c.fin+c.dunk*.5+c.stl*.6+c.blkW*2+c.spd/180,3)};
/* CPU series scores in Hoop Stars points: winners usually 12 to 20, sometimes as low as 7 or up to 30;
   margins range from close (1-4) to okay (5-9) to blowouts (10+) */
function cpuScore(){
  const g=()=>Math.sqrt(-2*Math.log(Math.random()+1e-9))*Math.cos(2*Math.PI*Math.random());
  const hi=Math.min(30,Math.max(7,Math.round(16+4.5*g())));
  const r=Math.random();
  const margin=r<.3?1+Math.floor(Math.random()*4):r<.75?5+Math.floor(Math.random()*5):10+Math.floor(Math.random()*11);
  return [hi,Math.max(0,Math.min(hi-1,hi-margin))];
}
/* CPU vs CPU series: decided by roster strength plus a little luck */
function playSeries(m){
  while(m.wa<m.need&&m.wb<m.need){
    const pa=powerOf(m.a)/(powerOf(m.a)+powerOf(m.b));
    const aWon=Math.random()<pa,pr=cpuScore(),hi=pr[0],lo=pr[1];
    m.games.push(aWon?[hi,lo]:[lo,hi]);
    if(aWon)m.wa++;else m.wb++;
  }
  m.done=true;m.winner=m.wa===m.need?m.a:m.b;
}
function simOthers(T){T.rounds[T.r].forEach(m=>{if(!m.done&&!isHuman(m))playSeries(m)})}
function newTournament(){
  /* 16 entrants: the player plus 15 random others */
  const ids=CH.map((_,i)=>i).filter(i=>i!==flow.ch);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  ids.length=15;ids.push(flow.ch);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const first=[];for(let i=0;i<ids.length;i+=2)first.push(newMatch(ids[i],ids[i+1]));
  flow.tour={rounds:[first],r:0,out:false,champ:null};
  simOthers(flow.tour);
}
/* when a round is fully decided, pair the winners into the next round and play its CPU series */
function tourAdvance(T){
  while(T.champ===null&&T.rounds[T.r].every(m=>m.done)){
    const w=T.rounds[T.r];
    if(w.length===1){T.champ=w[0].winner;return}
    const need=w.length===2?2:1;/* the final is best of 3 */
    const nxt=[];for(let i=0;i<w.length;i+=2)nxt.push(newMatch(w[i].winner,w[i+1].winner,need));
    T.rounds.push(nxt);T.r++;simOthers(T);
  }
}
/* you are out: play out the rest of the bracket automatically */
function finishTour(T){
  for(let g=0;T.champ===null&&g<6;g++){T.rounds[T.r].forEach(m=>{if(!m.done)playSeries(m)});tourAdvance(T)}
}
function matchHTML(m){

  return `<div class="match${isHuman(m)?' mine':''}${m.done?'':''}">${row(m.a,m.wa)}${row(m.b,m.wb)}${m.games.length?`<div class="pips">${pips}</div>`:''}</div>`;
}

function statsHTML(res){
  if(!res.stats)return '';
  const [A,B]=res.stats,n=res.names;
  const pct=s=>(s.fga?Math.round(100*s.fgm/s.fga):0)+'%';
  const row=(l,a,c)=>`<div class="sv">${a}</div><div class="sl">${l}</div><div class="sv">${c}</div>`;
  return `<div class="stats"><div class="sn" style="color:${n[0].col}">${n[0].t}</div><div></div><div class="sn" style="color:${n[1].col}">${n[1].t}</div>`
    +row('Points',res.you,res.cpu)+row('FG',`${A.fgm}/${A.fga}`,`${B.fgm}/${B.fga}`)+row('FG%',pct(A),pct(B))
    +row('Rebounds',A.reb,B.reb)+row('Blocks',A.blk,B.blk)+row('Steals',A.stl,B.stl)+row('Turnovers',A.to,B.to)+'</div>';
}
function endScreen(eyebrow,title,score,buttons,res){
  showScreen(`<div class="card"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2><div class="score">${score}</div>${statsHTML(res)}<div class="row">${buttons}</div></div>`);
}
/* records your game in the bracket and moves the bracket on when your series ends */
function tourGameEnd(T,res){
  const m=T.rounds[T.r].find(isHuman),humanA=m.a===flow.ch;
  m.games.push(humanA?[res.you,res.cpu]:[res.cpu,res.you]);
  const aWon=humanA?res.win:!res.win;
  if(aWon)m.wa++;else m.wb++;
  if(m.wa<m.need&&m.wb<m.need)return {m,over:false,won:false};
  m.done=true;m.winner=m.wa===m.need?m.a:m.b;
  const won=m.winner===flow.ch;
  if(won)tourAdvance(T);else{T.out=true;finishTour(T)}
  return {m,over:true,won};
}
function onEnd(res){
  const score=`${res.you} – ${res.cpu}`;
  const again='<button class="btn primary" data-act="go" type="button">Rematch</button><button class="btn" data-act="pick" type="button">Change players</button><button class="btn" data-act="home" type="button">Menu</button>';
  setTimeout(()=>{
    if(flow.mode==='tour'){
      const T=flow.tour,{m,over,won}=tourGameEnd(T,res),ser=`${m.wa}–${m.wb}`;
      const menu='<button class="btn" data-act="home" type="button">Main menu</button>';
      if(!over)endScreen('Tournament · '+ROUNDS[T.r],'Game '+m.games.length,score+' · series '+ser,'<button class="btn primary" data-act="bracket" type="button">Bracket</button>',res);
      else if(!won)endScreen('Tournament','Eliminated',score,'<button class="btn primary" data-act="bracket" type="button">View bracket</button>'+menu,res);
      else if(T.champ===flow.ch)endScreen('Tournament','Champion',score,'<button class="btn primary" data-act="bracket" type="button">View bracket</button>'+menu,res);
      else endScreen('Tournament · series '+ser,'Series won',score,'<button class="btn primary" data-act="bracket" type="button">Next round</button>',res);
    }else if(flow.mode==='two')endScreen('Two players',res.win?'Player 1 wins':'Player 2 wins',score,again,res);
    else endScreen('Quick match',res.win?'You win':'You lose',score,again,res);
  },1100);
}
function launchMatch(){
  if(flow.mode==='two')startMatch(flow.ch,flow.ch2,onEnd,true);
  else if(flow.mode==='tour'){
    const T=flow.tour,m=T.rounds[T.r].find(isHuman),op=m.a===flow.ch?m.b:m.a;
    startMatch(flow.ch,op,onEnd,false,DIFF[Math.min(T.r,2)].lvl);
  }
  else startMatch(flow.ch,flow.ch2,onEnd,false,DIFF[flow.diff].lvl);
}
scr.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.arrow!==undefined){
    const [k,side,d]=t.dataset.arrow.split('|'),g=flow.pg[k],n=TEAM_LIST.length;
    g[side]=(g[side]+ +d+n)%n;pickScreen();return;
  }
  if(t.dataset.slot!==undefined){flow.slot=+t.dataset.slot;pickScreen();return}
  if(t.dataset.op!==undefined){flow.ch2=+t.dataset.op;pickScreen();return}
  if(t.dataset.ch!==undefined){
    const i=+t.dataset.ch;
    flow.ch=i;
    pickScreen();return;
  }
  if(t.dataset.diff!==undefined){flow.diff=+t.dataset.diff;pickScreen();return}
  const act=t.dataset.act;
  if(act==='single')singleScreen();
  else if(act==='back'){if(flow.mode==='two')homeScreen();else singleScreen()}
  else if(act==='quick'){flow.mode='quick';flow.slot=0;if(flow.ch2===flow.ch)flow.ch2=CH.findIndex((_,k)=>k!==flow.ch);pickScreen()}
  else if(act==='two'){flow.mode='two';flow.slot=0;if(flow.ch2===flow.ch)flow.ch2=CH.findIndex((_,k)=>k!==flow.ch);pickScreen()}
  else if(act==='tour'){flow.mode='tour';pickScreen()}
  else if(act==='pick')pickScreen();
  else if(act==='home')homeScreen();
  else if(act==='fouls'){foulsOn=!foulsOn;homeScreen()}
  else if(act==='go'){if(flow.mode==='tour'){newTournament();bracketScreen()}else launchMatch()}
  else if(act==='bracket')bracketScreen();
  else if(act==='resume')resumeGame();
  else if(act==='quit'){hideBinds();homeScreen()}
  else if(act==='play')launchMatch();
});

/* ---------- input ---------- */
/* set 1 = Basketball Stars player 1 keys, set 2 = player 2 keys, set 0 = extras for solo play */
const KEYS=[
  ['ArrowLeft',1,'l'],['ArrowRight',1,'r'],['ArrowUp',1,'jump'],['ArrowDown',1,'fake'],['KeyL',1,'steal'],['KeyK',1,'sup'],
  ['KeyA',2,'l'],['KeyD',2,'r'],['KeyW',2,'jump'],['KeyS',2,'fake'],['KeyB',2,'steal'],['KeyV',2,'sup'],
  ['ShiftLeft',0,'dash'],['ShiftRight',0,'dash'],['Space',0,'jump']
];
const down=new Set(),taps={},pad={l:0,r:0,jump:0};
function playerFor(set){if(set===1)return 0;if(set===2)return st.two?1:0;return st.two?-1:0}
function poll(){
  const humans=st.two?[0,1]:[0];
  for(const i of humans){const n=st.p[i].inp;n.l=0;n.r=0;n.jump=0}
  for(const [code,set,act] of KEYS){
    if(act!=='l'&&act!=='r'&&act!=='jump')continue;
    if(!down.has(code))continue;
    const pl=playerFor(set);if(pl>=0)st.p[pl].inp[act]=1;
  }
  if(!st.two){const n=st.p[0].inp;if(pad.l)n.l=1;if(pad.r)n.r=1;if(pad.jump)n.jump=1}
}
function setKeysHint(){
  const el=document.getElementById('keys');if(!el)return;
  el.innerHTML=st&&st.two
    ?'<b>P1</b> <kbd>←</kbd><kbd>→</kbd> move &middot; <kbd>↑</kbd> jump/shoot &middot; <kbd>\u2193</kbd> fake &middot; <kbd>L</kbd> steal &middot; <kbd>K</kbd> takeover &nbsp;|&nbsp; <b>P2</b> <kbd>A</kbd><kbd>D</kbd> move &middot; <kbd>W</kbd> jump/shoot &middot; <kbd>S</kbd> fake &middot; <kbd>B</kbd> steal &middot; <kbd>V</kbd> takeover &nbsp;|&nbsp; double-tap a direction to dash &middot; <kbd>P</kbd> pause'
    :'<kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> move &middot; hold <kbd>↑</kbd> or <kbd>W</kbd> to jump, release near the top to shoot &middot; double-tap a direction (or <kbd>Shift</kbd>) to dash &middot; <kbd>S</kbd> or <kbd>\u2193</kbd> pump fake &middot; <kbd>L</kbd> steal &middot; <kbd>K</kbd> takeover &middot; <kbd>P</kbd> pause';
}
function showBinds(){
  const el=document.getElementById('binds');if(!el||!st)return;
  el.innerHTML=st.two
    ?'<div class="bgrid"><span><b>P1</b> <kbd>←</kbd><kbd>→</kbd> move</span><span><b>P2</b> <kbd>A</kbd><kbd>D</kbd> move</span><span><b>P1</b> <kbd>↑</kbd> hold to jump, release near the top to shoot</span><span><b>P2</b> <kbd>W</kbd> hold to jump, release near the top to shoot</span><span><b>P1</b> <kbd>↓</kbd> fake &middot; <kbd>L</kbd> steal &middot; <kbd>K</kbd> takeover</span><span><b>P2</b> <kbd>S</kbd> fake &middot; <kbd>B</kbd> steal &middot; <kbd>V</kbd> takeover</span><span>double-tap a direction to dash</span><span><kbd>P</kbd> pause</span></div>'
    :'<div class="bgrid"><span><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> move</span><span>hold <kbd>↑</kbd> or <kbd>W</kbd> to jump, release near the top to shoot</span><span><kbd>Shift</kbd> or double-tap to dash</span><span><kbd>↓</kbd> or <kbd>S</kbd> pump fake</span><span><kbd>L</kbd> steal</span><span><kbd>K</kbd> takeover</span><span><kbd>P</kbd> pause</span></div>';
  el.classList.add('on');
}
function hideBinds(){const el=document.getElementById('binds');if(el)el.classList.remove('on')}
/* pause tab: resume or quit the match */
function togglePause(){if(st&&st.phase!=='over'){if(st.paused)resumeGame();else{st.paused=true;pauseScreen()}}}
function resumeGame(){if(!st)return;st.paused=false;hideScreen();document.getElementById('pause').hidden=false}
function pauseScreen(){
  showScreen(`<div class="card menu"><p class="eyebrow">Paused</p><h2>Paused</h2><button class="btn primary" data-act="resume" type="button">Resume</button><button class="btn" data-act="quit" type="button">Quit match</button></div>`);
}
window.addEventListener('keydown',e=>{
  if(e.code==='KeyP'&&!e.repeat){togglePause();return}
  const rows=KEYS.filter(k=>k[0]===e.code);
  if(!rows.length||!st)return;
  e.preventDefault();
  down.add(e.code);
  if(e.repeat)return;
  for(const [code,set,act] of rows){
    const pl=playerFor(set);if(pl<0)continue;
    const inp=st.p[pl].inp;
    if(act==='steal'||act==='sup'||act==='dash'||act==='fake')inp[act]=1;
    else if(act==='l'||act==='r'){
      const now=performance.now();
      if(taps[code]&&now-taps[code]<260){inp.dash=1;taps[code]=0}else taps[code]=now;
    }
  }
});
window.addEventListener('keyup',e=>{
  if(KEYS.some(k=>k[0]===e.code)){down.delete(e.code);if(st)e.preventDefault()}
});
window.addEventListener('blur',()=>{down.clear();pad.l=pad.r=pad.jump=0});
document.querySelectorAll('#pad button').forEach(btn=>{
  const k=btn.dataset.k;
  const on=e=>{
    e.preventDefault();btn.classList.add('on');
    if(k==='l'||k==='r'||k==='jump')pad[k]=1;
    else if(st&&!st.two)st.p[0].inp[k]=1;
    try{btn.setPointerCapture(e.pointerId)}catch(_){}
  };
  const off=e=>{e.preventDefault();btn.classList.remove('on');if(k in pad)pad[k]=0};
  btn.addEventListener('pointerdown',on);
  btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);
  btn.addEventListener('lostpointercapture',off);
});
/* Fullscreen: use the real Fullscreen API on the whole game wrapper; if the page isn't allowed to (embedded frames, iPhone), fill the frame instead. */
const wrapEl=document.getElementById('wrap'),fsBtn=document.getElementById('fs');
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement)||wrapEl.classList.contains('pfs')}
function fsSync(){
  const native=!!(document.fullscreenElement||document.webkitFullscreenElement);
  wrapEl.classList.toggle('fs',native||wrapEl.classList.contains('pfs'));
  fsBtn.textContent=fsOn()?'Exit fullscreen':'Fullscreen';
}
function toggleFS(){
  if(fsOn()){
    wrapEl.classList.remove('pfs');
    const ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(document.fullscreenElement||document.webkitFullscreenElement)ex.call(document);
    fsSync();return;
  }
  const rq=wrapEl.requestFullscreen||wrapEl.webkitRequestFullscreen;
  const fallback=()=>{wrapEl.classList.add('pfs');fsSync()};
  if(!rq){fallback();return}
  try{const r=rq.call(wrapEl);if(r&&r.catch)r.catch(fallback)}catch(e){fallback()}
}
document.addEventListener('fullscreenchange',fsSync);
document.addEventListener('webkitfullscreenchange',fsSync);
fsBtn.addEventListener('click',e=>{toggleFS();e.currentTarget.blur()});
window.addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat&&!e.ctrlKey&&!e.metaKey){toggleFS()}});
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&wrapEl.classList.contains('pfs')){wrapEl.classList.remove('pfs');fsSync()}});
document.getElementById('pause').addEventListener('click',e=>{togglePause();e.currentTarget.blur()});
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.blur()});

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  update(dt);hoopPhysics(dt);if(!st||!st.paused)updateParts(dt);crowdAudio();draw();
  requestAnimationFrame(frame);
}
homeScreen();
requestAnimationFrame(frame);
})();
</script>
